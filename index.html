<!DOCTYPE html>
<html lang="en-us">
<head>
  <base href="./">
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <title>Unity Web Player | Hollow Knight SilkSong</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    /* ================= DEBUG PANEL ================= */

    #unity-debug-panel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 190px;

      z-index: 999999;

      background: rgba(5, 5, 5, 0.97);
      border-top: 2px solid #806f4a;

      color: #f0e7c8;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;

      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    #unity-debug-header {
      height: 32px;
      min-height: 32px;

      padding: 0 10px;

      background: #17140f;
      border-bottom: 1px solid #403826;

      display: flex;
      align-items: center;
      justify-content: space-between;

      font-weight: bold;
      letter-spacing: 1px;
    }

    #unity-debug-header button {
      background: #30291e;
      color: #f0e7c8;

      border: 1px solid #806f4a;

      padding: 3px 10px;

      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
    }

    #unity-debug-header button:hover {
      background: #4a3d2b;
    }

    #unity-debug-output {
      flex: 1;

      margin: 0;
      padding: 8px;

      overflow-y: auto;

      white-space: pre-wrap;
      word-break: break-word;

      box-sizing: border-box;
    }

    .unity-log {
      color: #d8d1bd;
    }

    .unity-warning {
      color: #e6c75c;
    }

    .unity-error {
      color: #ff6b6b;
    }

    /* ================= PAGE ================= */

    body {
      margin: 0;
      padding-bottom: 190px;

      background: #050505;
      color: #f0e7c8;

      font-family: Georgia, "Times New Roman", serif;

      box-sizing: border-box;
    }
  </style>
</head>

<body>

  <!-- ================= DEBUG PANEL ================= -->

  <div id="unity-debug-panel">

    <div id="unity-debug-header">
      <span>UNITY LOG / ERRORS</span>

      <button id="unity-debug-clear">
        CLEAR
      </button>
    </div>

    <pre id="unity-debug-output"></pre>

  </div>


  <!-- ================= LOADING TEXT ================= -->
   
  <div
    id="loading-text"
    style="
      color: #f0e7c8;
      font-size: 42px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      margin-top: 24px;
      text-shadow: 0 0 12px rgba(240, 231, 200, 0.25);
    "
  >
    LOADING...
  </div>


  <!-- ================= UNITY CONTAINER ================= -->

  <div id="unity-container">

    <canvas
      id="unity-canvas"
      width="960"
      height="600"
      tabindex="-1"
    ></canvas>

    <div id="unity-loading-bar">

      <div id="unity-logo"></div>

      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>

    </div>

    <div id="unity-warning"></div>

  </div>


  <!-- ================= JSZIP ================= -->

  <script src="jszip.js"></script>


  <script>

    /* ============================================================
       DEBUG PANEL
       ============================================================ */

    const loadingText =
      document.querySelector("#loading-text");

    const debugOutput =
      document.querySelector("#unity-debug-output");

    const debugClear =
      document.querySelector("#unity-debug-clear");


    function unityDebug(message, type = "unity-log") {

      const line =
        document.createElement("div");

      const time =
        new Date().toLocaleTimeString();

      line.className = type;

      line.textContent =
        "[" + time + "] " + String(message);

      debugOutput.appendChild(line);

      debugOutput.scrollTop =
        debugOutput.scrollHeight;
    }


    debugClear.addEventListener("click", () => {
      debugOutput.innerHTML = "";
    });


    /* ============================================================
       JAVASCRIPT ERROR CAPTURE
       ============================================================ */

    window.addEventListener("error", (event) => {

      unityDebug(
        "JAVASCRIPT ERROR: " +
        event.message +
        " @ " +
        event.filename +
        ":" +
        event.lineno +
        ":" +
        event.colno,
        "unity-error"
      );

    });


    window.addEventListener(
      "unhandledrejection",
      (event) => {

        unityDebug(
          "UNHANDLED PROMISE: " +
          String(event.reason),
          "unity-error"
        );

      }
    );


    /* ============================================================
       CONSOLE CAPTURE
       ============================================================ */

    const originalConsoleLog =
      console.log;

    const originalConsoleWarn =
      console.warn;

    const originalConsoleError =
      console.error;


    console.log = function (...args) {

      unityDebug(
        args.map(String).join(" "),
        "unity-log"
      );

      originalConsoleLog.apply(
        console,
        args
      );
    };


    console.warn = function (...args) {

      unityDebug(
        "WARNING: " +
        args.map(String).join(" "),
        "unity-warning"
      );

      originalConsoleWarn.apply(
        console,
        args
      );
    };


    console.error = function (...args) {

      unityDebug(
        "ERROR: " +
        args.map(String).join(" "),
        "unity-error"
      );

      originalConsoleError.apply(
        console,
        args
      );
    };


    unityDebug(
      "Debug panel initialized."
    );


    /* ============================================================
       CACHE
       ============================================================ */

    const CACHE_NAME =
      "hksilksongcache-v3";


    function getCacheKeyCandidates(input) {

      const pathname =
        typeof input === "string"
          ? input
          : new URL(
              input,
              window.location.href
            ).pathname;


      const normalized =
        pathname.replace(/^\/+/, "");


      const withoutStreamingAssets =
        normalized.replace(
          /^StreamingAssets\//,
          ""
        );


      const withoutAa =
        withoutStreamingAssets.replace(
          /^aa\//,
          ""
        );


      const withoutWebGL =
        withoutAa.replace(
          /^WebGL\//,
          ""
        );


      const candidates = new Set([
        pathname,

        `/${normalized}`,

        `/StreamingAssets/${normalized}`,

        `/StreamingAssets/aa/${normalized}`,

        `/StreamingAssets/aa/WebGL/${normalized}`,

        `/${withoutStreamingAssets}`,

        `/StreamingAssets/${withoutStreamingAssets}`,

        `/StreamingAssets/aa/${withoutStreamingAssets}`,

        `/StreamingAssets/aa/WebGL/${withoutStreamingAssets}`,

        `/${withoutAa}`,

        `/StreamingAssets/${withoutAa}`,

        `/StreamingAssets/aa/${withoutAa}`,

        `/StreamingAssets/aa/WebGL/${withoutAa}`,

        `/${withoutWebGL}`,

        `/StreamingAssets/${withoutWebGL}`,

        `/StreamingAssets/aa/${withoutWebGL}`,

        `/StreamingAssets/aa/WebGL/${withoutWebGL}`
      ]);


      return [...candidates];
    }


    async function cacheResponse(
      cache,
      assetName,
      response
    ) {

      const keys =
        getCacheKeyCandidates(assetName);


      await Promise.all(
        keys.map(
          key =>
            cache.put(
              key,
              response.clone()
            )
        )
      );
    }


    async function getCachedResponse(
      cache,
      requestUrl
    ) {

      const candidates =
        getCacheKeyCandidates(requestUrl);


      for (const key of candidates) {

        const cachedResponse =
          await cache.match(key);

        if (cachedResponse) {
          return cachedResponse;
        }
      }


      return null;
    }


    /* ============================================================
       FETCH OVERRIDE
       ============================================================ */

    const originalFetch =
      window.fetch;


    window.fetch = async function (
      resource,
      options
    ) {

      const requestUrl =
        typeof resource === "string"
          ? resource
          : resource.url;


      const cache =
        await caches.open(
          CACHE_NAME
        );


      const cachedResponse =
        await getCachedResponse(
          cache,
          requestUrl
        );


      if (cachedResponse) {

        return cachedResponse;
      }


      return originalFetch(
        resource,
        options
      );
    };


    /* ============================================================
       SERVICE WORKER
       ============================================================ */

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register("./sw.js")
            .catch((error) => {

              console.error(
                "Service worker error:",
                error
              );

            });

        }
      );

    }


    /* ============================================================
       CACHE CHECK
       ============================================================ */

    async function isCached() {

      const cache =
        await caches.open(
          CACHE_NAME
        );


      const done =
        await cache.match(
          "CACHE_COMPLETE"
        );


      return !!done;
    }


    async function cleanupOldCaches() {

      const cacheNames =
        await caches.keys();


      await Promise.all(

        cacheNames.map(
          name => {

            if (
              name !== CACHE_NAME &&
              name.includes("hksilksong")
            ) {

              console.log(
                "Deleting old cache:",
                name
              );


              return caches.delete(name);
            }

          }
        )

      );
    }


    /* ============================================================
       UNZIP
       ============================================================ */

    async function unzipAndStore(zipBlob) {

      if (!zipBlob) {

        throw new Error(
          "ZIP is missing"
        );

      }


      loadingText.textContent =
        "EXTRACTING ASSETS...";


      unityDebug(
        "Starting ZIP extraction..."
      );


      const zip =
        await JSZip.loadAsync(
          zipBlob
        );


      const files =
        Object.values(zip.files)
          .filter(
            file => !file.dir
          );


      const total =
        files.length;


      const cache =
        await caches.open(
          CACHE_NAME
        );


      let processed = 0;

      const batchSize = 3;


      for (
        let i = 0;
        i < files.length;
        i += batchSize
      ) {

        const batch =
          files.slice(
            i,
            i + batchSize
          );


        await Promise.all(

          batch.map(
            async (file) => {

              try {

                const blob =
                  await file.async(
                    "blob"
                  );


                const response =
                  new Response(
                    blob,
                    {
                      headers: {
                        "Content-Type":
                          blob.type ||
                          "application/octet-stream"
                      }
                    }
                  );


                await cacheResponse(
                  cache,
                  file.name,
                  response
                );


              } catch (e) {

                console.error(
                  "Failed:",
                  file.name,
                  e
                );

              }


              processed++;


              loadingText.textContent =
                `EXTRACTING ASSETS... (${processed}/${total})`;
            }
          )

        );


        await new Promise(
          r => setTimeout(r, 0)
        );
      }


      await cache.put(
        "CACHE_COMPLETE",
        new Response("ok")
      );


      console.log(
        "Cache complete"
      );
    }


    /* ============================================================
       DOWNLOAD
       ============================================================ */

    let loadedBytes = 0;


    async function fetchWithProgress(url) {

      const response =
        await originalFetch(url);


      if (!response.ok) {

        throw new Error(
          "Failed to fetch: " +
          url
        );

      }


      const reader =
        response.body.getReader();


      let chunks = [];

      let received = 0;


      while (true) {

        const {
          done,
          value
        } = await reader.read();


        if (done) {
          break;
        }


        received +=
          value.length;


        loadedBytes +=
          value.length;


        chunks.push(value);


        const mbDone =
          (
            loadedBytes /
            (1024 * 1024)
          ).toFixed(2);


        const mbTotal =
          "1986.64";


        loadingText.textContent =
          `DOWNLOADING ASSETS... (${mbDone} MB / ${mbTotal} MB)`;


        await new Promise(
          r => setTimeout(r, 0)
        );
      }


      const fullBuffer =
        new Uint8Array(
          received
        );


      let offset = 0;


      for (const chunk of chunks) {

        fullBuffer.set(
          chunk,
          offset
        );


        offset +=
          chunk.length;
      }


      return fullBuffer.buffer;
    }


    /* ============================================================
       MERGE
       ============================================================ */

    async function mergeFiles(parts) {

      console.log(
        "Downloading parts:",
        parts.length
      );


      const blobs = [];


      for (
        let i = 0;
        i < parts.length;
        i++
      ) {

        const part =
          parts[i];


        try {

          const buffer =
            await fetchWithProgress(
              part
            );


          blobs.push(
            new Blob([buffer])
          );


        } catch (e) {

          console.error(
            "Failed to download part",
            part,
            e
          );


          throw e;
        }


        await new Promise(
          r => setTimeout(r, 0)
        );
      }


      return new Blob(blobs);
    }


    /* ============================================================
       UTIL
       ============================================================ */

    function getParts(
      file,
      start,
      end
    ) {

      const parts = [];


      for (
        let i = start;
        i <= end;
        i++
      ) {

        parts.push(
          file +
          ".part" +
          i
        );
      }


      return parts;
    }


    /* ============================================================
       MAIN
       ============================================================ */

    (async () => {

      try {

        await cleanupOldCaches();


        if (!(await isCached())) {

          loadingText.textContent =
            "DOWNLOADING ASSETS...";


          const webglzip =
            await mergeFiles(
              getParts(
                "StreamingAssets/aa/WebGL.zip",
                1,
                100
              )
            );


          await unzipAndStore(
            webglzip
          );


        } else {

          loadingText.textContent =
            "LOADING FROM CACHE...";

        }


        /* ========================================================
           UNITY START
           ======================================================== */

        const canvas =
          document.querySelector(
            "#unity-canvas"
          );


        const loadingBar =
          document.querySelector(
            "#unity-loading-bar"
          );


        const progressBarFull =
          document.querySelector(
            "#unity-progress-bar-full"
          );


        const warningBanner =
          document.querySelector(
            "#unity-warning"
          );


        function unityShowBanner(
          msg,
          type
        ) {

          function update() {

            warningBanner.style.display =
              warningBanner.children.length
                ? "block"
                : "none";

          }


          const div =
            document.createElement(
              "div"
            );


          div.innerHTML = msg;


          warningBanner.appendChild(
            div
          );


          if (type === "error") {

            div.style =
              "background:red;padding:10px;";


            unityDebug(
              "[Unity Banner ERROR] " +
              msg,
              "unity-error"
            );


          } else if (
            type === "warning"
          ) {

            div.style =
              "background:yellow;padding:10px;";


            unityDebug(
              "[Unity Banner WARNING] " +
              msg,
              "unity-warning"
            );


            setTimeout(
              () => {

                if (
                  div.parentNode ===
                  warningBanner
                ) {

                  warningBanner.removeChild(
                    div
                  );
                }


                update();

              },
              5000
            );
          }


          update();
        }


        /* ========================================================
           UNITY CONFIG
           ======================================================== */

        const buildUrl =
          "./Build";


        const config = {

          dataUrl:
            buildUrl +
            "/w-pt.data.unityweb",

          frameworkUrl:
            buildUrl +
            "/w-pt.framework.js.unityweb",

          codeUrl:
            buildUrl +
            "/w-pt.wasm.unityweb",

          streamingAssetsUrl:
            "./StreamingAssets",

          companyName:
            "EDUrocks Group, Truffled, GN-Math",

          productName:
            "Hollow Knight SilkSong",

          productVersion:
            "1.0",

          showBanner:
            unityShowBanner,


          /* Unity log output */

          print: function (message) {

            unityDebug(
              "[Unity] " + message,
              "unity-log"
            );

          },


          /* Unity error output */

          printErr: function (message) {

            unityDebug(
              "[Unity ERROR] " + message,
              "unity-error"
            );

          }

        };


        /* ========================================================
           LOAD UNITY
           ======================================================== */

        loadingBar.style.display =
          "block";


        const script =
          document.createElement(
            "script"
          );


        script.src =
          "./Build/w-pt.loader.js";


        script.onload = () => {

          unityDebug(
            "Unity loader loaded."
          );


          try {

            createUnityInstance(
              canvas,
              config,
              (progress) => {

                progressBarFull.style.width =
                  (progress * 100) +
                  "%";

              }
            )

            .then(() => {

              unityDebug(
                "Unity initialized successfully."
              );


              loadingBar.remove();

              loadingText.remove();

            })


            .catch((error) => {

              unityDebug(
                "[UNITY FATAL] " +
                (
                  error.stack ||
                  error
                ),
                "unity-error"
              );


              console.error(
                "Unity failed to start:",
                error
              );

            });

          } catch (error) {

            unityDebug(
              "[UNITY STARTUP EXCEPTION] " +
              (
                error.stack ||
                error
              ),
              "unity-error"
            );


            console.error(
              "Unity startup exception:",
              error
            );

          }

        };


        script.onerror = () => {

          unityDebug(
            "[FATAL] Could not load " +
            "./Build/w-pt.loader.js",
            "unity-error"
          );

        };


        document.body.appendChild(
          script
        );


      } catch (err) {

        console.error(err);


        unityDebug(
          "[FATAL LOADER ERROR] " +
          (
            err.stack ||
            err.message ||
            err
          ),
          "unity-error"
        );


        loadingText.textContent =
          "ERROR: " +
          (
            err.message ||
            err
          );
      }

    })();

  </script>

</body>
</html>
